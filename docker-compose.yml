name: tianet

x-backend: &backend
  build: .
  environment: &backend-env
    DATABASE_URL: postgresql+psycopg://emprestimo:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}@postgres:5432/emprestimo
    APP_ENV: ${APP_ENV:-development}
    JWT_SECRET_KEY: ${JWT_SECRET_KEY:?defina JWT_SECRET_KEY no .env}
    EVOLUTION_HOST: ${EVOLUTION_HOST:-https://diamondgreen.com.br}
    # Credenciais de Tenant: criar, listar e apagar instancia (IMP-368).
    EVOLUTION_TENANT_ID: ${EVOLUTION_TENANT_ID:-}
    EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-}
    WHATSAPP_TOKEN_ENCRYPTION_KEY: ${WHATSAPP_TOKEN_ENCRYPTION_KEY:-}
  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: emprestimo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: emprestimo
    # Loopback apenas: o banco nunca deve escutar na interface publica.
    # A porta do host e propriedade da maquina, nao do projeto: quem tem outro
    # Postgres rodando define POSTGRES_PORT no .env. O padrao segue 5432.
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emprestimo -d emprestimo"]
      interval: 5s
      timeout: 5s
      retries: 10

  # One-shot: api e worker so sobem depois que o schema esta na versao head.
  migrate:
    <<: *backend
    command: alembic upgrade head
    restart: "no"

  api:
    <<: *backend
    command: uvicorn emprestimo.presentation.api.main:app --host 0.0.0.0 --port 8000
    environment:
      <<: *backend-env
      PLATFORM_ADMIN_BOOTSTRAP_ENABLED: ${PLATFORM_ADMIN_BOOTSTRAP_ENABLED:-false}
      PLATFORM_ADMIN_BOOTSTRAP_SECRET_HASH: ${PLATFORM_ADMIN_BOOTSTRAP_SECRET_HASH:-}
      TIANET_AGENT_ENABLED: ${TIANET_AGENT_ENABLED:-false}
      TIANET_AGENT_INTERNAL_SECRET: ${TIANET_AGENT_INTERNAL_SECRET:-}
      TIANET_AGENT_SOCKET: /run/tianet-agent/agent.sock
    volumes:
      - agent-runtime:/run/tianet-agent:ro
    # 3000 vive aqui porque o frontend compartilha esta netns (ver servico frontend).
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
      - "127.0.0.1:${FRONTEND_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request;urllib.request.urlopen("http://127.0.0.1:8000/health",timeout=3)
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  worker:
    <<: *backend
    command: emprestimo-scheduler-worker
    environment:
      <<: *backend-env
      # E-mail e opcional: esta fora do escopo do MVP (contexto-externo §2.3).
      # Sem RESEND_*, em development o worker usa o fake; em production ele
      # sobe assim mesmo, com um canal que recusa nomeado em vez de fingir
      # entrega. EVOLUTION_INSTANCE_TOKEN, esse sim, e obrigatorio em
      # production — WhatsApp e o canal real da operacao.
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM: ${RESEND_FROM:-}
      EVOLUTION_INSTANCE_TOKEN: ${EVOLUTION_INSTANCE_TOKEN:-}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    # O worker trata SIGTERM e drena o lease antes de sair.
    stop_grace_period: 30s

  agent:
    build:
      context: .
      dockerfile: Dockerfile.agent
      args:
        CODEX_VERSION: "0.146.1"
        CODEX_SHA256: "f558105aec12bf6fb33570793adfc089f8b41dc32aced60b8b4fba9b451824ac"
    environment:
      TIANET_AGENT_ENABLED: ${TIANET_AGENT_ENABLED:-false}
      TIANET_AGENT_INTERNAL_SECRET: ${TIANET_AGENT_INTERNAL_SECRET:-}
      CODEX_EXECUTABLE: /usr/local/bin/codex
      CODEX_HOME: /var/lib/tianet-agent/codex
      CODEX_USER_AGENT_IDENTITY: tianet-agent-auth/0.146.1
      TIANET_AGENT_RUNTIME: /tmp/tianet-agent
      TIANET_AGENT_SOCKET: /run/tianet-agent/agent.sock
      HTTPS_PROXY: http://agent-egress-proxy:8080
      HTTP_PROXY: http://agent-egress-proxy:8080
      NO_PROXY: 127.0.0.1,localhost
    # Rede interna exclusiva; o unico egress passa pelo proxy com allowlist.
    networks:
      - agent-egress
    depends_on:
      agent-egress-proxy:
        condition: service_healthy
    volumes:
      - agent-codex-data:/var/lib/tianet-agent/codex
      - agent-runtime:/run/tianet-agent
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true

  agent-egress-proxy:
    build:
      context: .
      dockerfile: Dockerfile.agent-egress-proxy
    networks:
      - agent-egress
      - provider-egress
    read_only: true
    tmpfs:
      - /tmp:size=8m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    init: true
    healthcheck:
      test: ["CMD", "python", "-m", "emprestimo.agent.egress_proxy", "health"]
      interval: 5s
      timeout: 3s
      retries: 5

  frontend:
    build: ./frontend
    # session.server.ts:95 recusa backend nao-HTTPS em producao, exceto loopback.
    # Compartilhar a netns da api torna 127.0.0.1:8000 legitimamente loopback:
    # o trafego com token nunca cruza a rede. No servidor isso vira HTTPS real.
    network_mode: "service:api"
    environment:
      FRONTEND_BACKEND_URL: http://127.0.0.1:8000
      FRONTEND_ORIGIN: ${FRONTEND_ORIGIN:-http://localhost:3000}
      FRONTEND_LOGIN_TENANT_IDENTIFICADOR: ${FRONTEND_LOGIN_TENANT_IDENTIFICADOR:-tianet-local}
      FRONTEND_SESSION_KEY_ID: ${FRONTEND_SESSION_KEY_ID:?defina no .env}
      FRONTEND_SESSION_KEY: ${FRONTEND_SESSION_KEY:?defina no .env}
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  agent-codex-data:
  agent-runtime:

networks:
  agent-egress:
    internal: true
  provider-egress:
