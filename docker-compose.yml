services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: emprestimo
      POSTGRES_PASSWORD: emprestimo
      POSTGRES_DB: emprestimo
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emprestimo -d emprestimo"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    command: uvicorn emprestimo.presentation.api.main:app --host 0.0.0.0 --port 8000
    environment:
      DATABASE_URL: postgresql+psycopg://emprestimo:emprestimo@postgres:5432/emprestimo
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres-data:
